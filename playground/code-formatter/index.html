<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <title>Code Formatter — Ravionus Playgrounds</title>
    <meta name="description" content="Format and beautify JSON, JavaScript, HTML, CSS, and SQL code in your browser. Auto-detects language, side-by-side view. No server, no sign-up.">
    <link rel="canonical" href="https://ravionus.com/playground/code-formatter/">
    <meta property="og:title" content="Code Formatter — Ravionus Playgrounds">
    <meta property="og:description" content="Format and beautify JSON, JavaScript, HTML, CSS, and SQL code in your browser. Auto-detects language, side-by-side view. No server, no sign-up.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ravionus.com/playground/code-formatter/">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none';">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- CDN ready counter (before CDN scripts) -->
    <script>
        var _cdnCount = 0;
        function _onCDN() {
            _cdnCount++;
            if (_cdnCount >= 3) {
                if (document.body) document.body.dataset.ready = 'true';
            }
        }
        document.addEventListener('DOMContentLoaded', function () {
            if (window.js_beautify && window.css_beautify && window.html_beautify) {
                document.body.dataset.ready = 'true';
            }
            // Fallback: try again after 3 s in case onload fires after DOMContentLoaded
            setTimeout(function () {
                if (window.js_beautify && window.css_beautify && window.html_beautify) {
                    document.body.dataset.ready = 'true';
                }
            }, 3000);
        });
    </script>
    <!-- js-beautify CDN — same SRI hashes as tools/formatter -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify.min.js"
            integrity="sha512-kElKX79OYM/vf2AU+lF4Zsi3AnKds70Mc6fRBImpwQzdZNbju6SyeTBBOUe1N9q1P456v1F01HAsjjWZkXIS4Q=="
            crossorigin="anonymous" onload="_onCDN()"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-css.min.js"
            integrity="sha512-GS3bO88bff1ieJ8ZKeWhjlK5Y6Mwvu4WmQ8gdIgbeSyp7iBaqSVxCUGgOV9RjiiQgoci/HW9n7IVn3o670AY8w=="
            crossorigin="anonymous" onload="_onCDN()"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-html.min.js"
            integrity="sha512-9oipLBY8N19ej4XlfPFHfdKkqn8FnAEsucbkycMoLthN77bImVWZ0GtLMfCrXBqpTetBn2eM9N1pliZJC7IrNA=="
            crossorigin="anonymous" onload="_onCDN()"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #0e0e16;
            --border: #1e1e2e;
            --border2: #2a2a3e;
            --text: #e2e2f0;
            --muted: #7878a0;
            --purple: #a855f7;
            --cyan: #22d3ee;
            --green: #22c55e;
            --red: #ef4444;
            --accent-g: linear-gradient(135deg, #a855f7, #22d3ee);
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        /* ── Page header ─────────────────────────────────── */
        .page-header {
            padding: 10px 18px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .page-header h1 { font-size: 1.1rem; font-weight: 700; margin-bottom: 2px; }
        .page-header p  { color: var(--muted); font-size: .82rem; line-height: 1.5; }

        /* ── Language bar ────────────────────────────────── */
        .lang-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .lang-label {
            font-size: .68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--muted);
            margin-right: 4px;
            white-space: nowrap;
        }
        .lang-btn {
            height: 26px;
            padding: 0 10px;
            border: 1px solid transparent;
            border-radius: 5px;
            background: transparent;
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: .78rem;
            font-weight: 500;
            cursor: pointer;
            transition: color .12s, background .12s, border-color .12s;
        }
        .lang-btn:hover { color: var(--text); background: var(--border); }
        .lang-btn.active {
            color: var(--cyan);
            background: rgba(34,211,238,.1);
            border-color: rgba(34,211,238,.3);
        }
        .lang-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
        .lang-sep { width: 1px; height: 16px; background: var(--border2); margin: 0 4px; flex-shrink: 0; }

        /* ── Toolbar ─────────────────────────────────────── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .tb-sep { width: 1px; height: 18px; background: var(--border2); margin: 0 4px; flex-shrink: 0; }
        .tb-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 28px;
            padding: 0 10px;
            border: none;
            border-radius: 5px;
            background: transparent;
            color: var(--muted);
            font-size: .78rem;
            font-weight: 600;
            cursor: pointer;
            transition: color .12s, background .12s;
            font-family: inherit;
            white-space: nowrap;
        }
        .tb-btn:hover { color: var(--text); background: var(--border); }
        .tb-btn.primary {
            background: rgba(168,85,247,.15);
            color: var(--purple);
            border: 1px solid rgba(168,85,247,.3);
        }
        .tb-btn.primary:hover { background: rgba(168,85,247,.25); color: #c084fc; }
        .tb-btn.danger:hover  { color: var(--red); background: rgba(239,68,68,.1); }
        .tb-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
        button:focus-visible, .tb-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

        /* ── Banners ─────────────────────────────────────── */
        .error-banner {
            display: none;
            padding: 7px 16px;
            background: rgba(239,68,68,.08);
            border-bottom: 1px solid rgba(239,68,68,.2);
            color: var(--red);
            font-size: .82rem;
            flex-shrink: 0;
            word-break: break-word;
        }
        .error-banner.visible { display: block; }
        .success-banner {
            display: none;
            padding: 6px 16px;
            background: rgba(34,197,94,.07);
            border-bottom: 1px solid rgba(34,197,94,.15);
            color: var(--green);
            font-size: .8rem;
            flex-shrink: 0;
            align-items: center;
            gap: 6px;
        }
        .success-banner.visible { display: flex; }

        /* ── Editor layout ────────────────────────────────── */
        .editor-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
            min-height: 0;
        }
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }
        .pane-divider { width: 1px; background: var(--border); flex-shrink: 0; }
        .pane-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 12px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .pane-title {
            font-size: .68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted);
        }
        .pane-meta {
            font-family: var(--font-mono);
            font-size: .68rem;
            color: var(--muted);
        }
        textarea {
            flex: 1;
            width: 100%;
            background: var(--bg);
            color: var(--text);
            border: none;
            outline: none;
            resize: none;
            padding: 14px 16px;
            font-family: var(--font-mono);
            font-size: .82rem;
            line-height: 1.7;
        }
        textarea::placeholder { color: var(--muted); opacity: .45; }
        textarea:read-only    { color: rgba(226,226,240,.8); }
        ::-webkit-scrollbar       { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

        /* ── Status bar ──────────────────────────────────── */
        .status-bar {
            flex-shrink: 0;
            padding: 4px 16px;
            background: var(--surface2);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: .7rem;
            font-family: var(--font-mono);
            color: var(--muted);
            flex-wrap: wrap;
        }
        .stat-sep { color: var(--border2); }
        #statDiff { padding: 1px 6px; border-radius: 3px; border: 1px solid; font-weight: 600; }

        /* ── Toast ───────────────────────────────────────── */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 8px;
            padding: 8px 18px;
            font-size: .82rem;
            color: var(--text);
            opacity: 0;
            transition: opacity .2s, transform .2s;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ── Mobile tabs ─────────────────────────────────── */
        .mobile-tabs {
            display: none;
            border-top: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }
        .mob-tab {
            flex: 1;
            padding: 9px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: .83rem;
            font-weight: 600;
            cursor: pointer;
            border-top: 2px solid transparent;
            margin-top: -1px;
            transition: color .15s, border-color .15s;
            font-family: inherit;
        }
        .mob-tab.active   { color: var(--cyan); border-top-color: var(--cyan); }
        .mob-tab:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

        /* ── Responsive ──────────────────────────────────── */
        @media (max-width: 700px) {
            .mobile-tabs  { display: flex; }
            .editor-layout { flex-direction: column; }
            .pane-divider  { width: 100%; height: 1px; }
            .pane          { display: none; }
            .pane.mob-visible { display: flex; }
            .toolbar { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
<script src="/site.js"></script>

<div class="page-breadcrumb">
    <a href="/">Ravionus</a>
    <span class="sep">›</span>
    <a href="/playground/">Playgrounds</a>
    <span class="sep">›</span>
    <span class="crumb-current">Code Formatter</span>
</div>

<header class="page-header">
    <h1>Code Formatter</h1>
    <p>Paste code on the left — hit <strong>Format</strong> to see the beautified result on the right. Supports JSON, JavaScript, HTML, CSS, and SQL. Auto-detects language.</p>
</header>

<!-- Language selector bar -->
<div class="lang-bar">
    <span class="lang-label" aria-label="Language:">Lang</span>
    <button class="lang-btn active" data-lang="auto" title="Auto-detect language from input"   aria-pressed="true">Auto</button>
    <button class="lang-btn"        data-lang="json" title="Format as JSON"                    aria-pressed="false">JSON</button>
    <button class="lang-btn"        data-lang="js"   title="Format as JavaScript"              aria-pressed="false">JS</button>
    <button class="lang-btn"        data-lang="html" title="Format as HTML"                    aria-pressed="false">HTML</button>
    <button class="lang-btn"        data-lang="css"  title="Format as CSS"                     aria-pressed="false">CSS</button>
    <button class="lang-btn"        data-lang="sql"  title="Format as SQL"                     aria-pressed="false">SQL</button>
</div>

<!-- Action toolbar -->
<div class="toolbar">
    <button id="btnFormat"   class="tb-btn primary" title="Format the input code (Ctrl+Enter)" aria-label="Format code">⚡ Format</button>
    <button id="btnSample"   class="tb-btn"         title="Load a sample snippet for the current language">🧪 Sample</button>
    <div class="tb-sep"></div>
    <button id="btnCopy"     class="tb-btn"         title="Copy formatted output to clipboard">📋 Copy Output</button>
    <button id="btnDownload" class="tb-btn"         title="Download formatted output as a file">⬇ Download</button>
    <div class="tb-right">
        <button id="btnClear" class="tb-btn danger" title="Clear both input and output">✕ Clear</button>
    </div>
</div>

<!-- Error banner -->
<div class="error-banner" id="errorBanner" role="alert" aria-live="assertive"></div>

<!-- Success banner -->
<div class="success-banner" id="successBanner" aria-live="polite"></div>

<!-- Split-pane editor -->
<div class="editor-layout">

    <div class="pane mob-visible" id="inputPane">
        <div class="pane-header">
            <span class="pane-title">Input</span>
            <span class="pane-meta" id="inMeta"></span>
        </div>
        <textarea id="inputArea"
            aria-label="Code input — paste code here to format"
            placeholder="Paste your code here, then click ⚡ Format…
Or use 🧪 Sample to load an example."
            spellcheck="false"></textarea>
    </div>

    <div class="pane-divider"></div>

    <div class="pane" id="outputPane">
        <div class="pane-header">
            <span class="pane-title">Formatted Output</span>
            <span class="pane-meta" id="outMeta"></span>
        </div>
        <textarea id="outputArea"
            aria-label="Formatted output — read-only result"
            placeholder="Formatted code will appear here…"
            readonly
            spellcheck="false"></textarea>
    </div>

</div>

<!-- Status bar -->
<div class="status-bar">
    <span id="statLang">—</span>
    <span class="stat-sep">·</span>
    <span>In: <span id="statIn">—</span></span>
    <span class="stat-sep">·</span>
    <span>Out: <span id="statOut">—</span></span>
    <span id="statDiff" style="display:none"></span>
</div>

<!-- Mobile tabs -->
<div class="mobile-tabs" id="mobileTabs">
    <button class="mob-tab active" id="tabInput"  title="Switch to input panel">📥 Input</button>
    <button class="mob-tab"        id="tabOutput" title="Switch to output panel">📤 Output</button>
</div>

<!-- Toast -->
<div id="toast" aria-live="polite" role="status"></div>

<script>
(function () {
    'use strict';

    // ── Constants ─────────────────────────────────────────────────────────────
    var STORAGE_KEY = 'ravionus_playground_code_formatter';

    // ── State ─────────────────────────────────────────────────────────────────
    var selectedLang = 'auto';
    var saveTimer    = null;
    var toastTimer   = null;

    // ── DOM refs ──────────────────────────────────────────────────────────────
    var inputArea     = document.getElementById('inputArea');
    var outputArea    = document.getElementById('outputArea');
    var errorBanner   = document.getElementById('errorBanner');
    var successBanner = document.getElementById('successBanner');
    var statLang      = document.getElementById('statLang');
    var statIn        = document.getElementById('statIn');
    var statOut       = document.getElementById('statOut');
    var statDiff      = document.getElementById('statDiff');
    var inMeta        = document.getElementById('inMeta');
    var outMeta       = document.getElementById('outMeta');
    var toast         = document.getElementById('toast');

    // ── Language detection ────────────────────────────────────────────────────
    function detectLang(code) {
        var s = code.trim();
        if (!s) return 'json';
        // SQL: starts with a SQL keyword
        if (/^\s*(SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|WITH)\s/i.test(s)) return 'sql';
        // JSON: starts with { or [
        if (s[0] === '{' || s[0] === '[') { try { JSON.parse(s); return 'json'; } catch (e) {} }
        // HTML: contains doctype or html/body tags
        if (/<!DOCTYPE\s+html/i.test(s) || /<html[\s>]/i.test(s) || /<\/html>/i.test(s)) return 'html';
        // CSS: typical selectors  { property: value; }
        if (/[#.a-z*][\w\s,:.#>+~*[\]()=^$|-]*\s*\{[\s\S]*:\s*[^;{}]+;/i.test(s) && !/function\s*\(/.test(s)) return 'css';
        // Default: JavaScript
        return 'js';
    }

    // ── Formatting ────────────────────────────────────────────────────────────
    function formatJSON(code) {
        var parsed = JSON.parse(code.trim());
        return JSON.stringify(parsed, null, 2);
    }

    function formatJS(code) {
        return window.js_beautify(code, {
            indent_size: 2,
            space_in_empty_paren: false,
            preserve_newlines: true,
            max_preserve_newlines: 2,
            jslint_happy: false,
            end_with_newline: true,
            break_chained_methods: false
        });
    }

    function formatHTML(code) {
        return window.html_beautify(code, {
            indent_size: 2,
            wrap_line_length: 0,
            preserve_newlines: true,
            max_preserve_newlines: 2,
            indent_inner_html: true,
            end_with_newline: true
        });
    }

    function formatCSS(code) {
        return window.css_beautify(code, {
            indent_size: 2,
            newline_between_rules: true,
            end_with_newline: true
        });
    }

    function formatSQL(code) {
        // Step 1: normalise whitespace to single spaces
        var s = code.replace(/\r\n/g, '\n').replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ').trim();

        // Step 2: uppercase SQL keywords (longer phrases first to avoid partial matches)
        var kws = ['LEFT OUTER JOIN', 'RIGHT OUTER JOIN', 'FULL OUTER JOIN',
                   'LEFT JOIN', 'RIGHT JOIN', 'INNER JOIN', 'CROSS JOIN', 'FULL JOIN',
                   'IS NOT NULL', 'IS NULL', 'NOT IN', 'GROUP BY', 'ORDER BY',
                   'UNION ALL', 'INSERT INTO', 'DELETE FROM', 'CREATE TABLE',
                   'ALTER TABLE', 'DROP TABLE', 'UNION', 'SELECT', 'DISTINCT',
                   'FROM', 'WHERE', 'JOIN', 'ON', 'HAVING', 'LIMIT', 'OFFSET',
                   'VALUES', 'UPDATE', 'INSERT', 'DELETE', 'SET', 'AND', 'OR', 'NOT',
                   'IN', 'BETWEEN', 'LIKE', 'EXISTS', 'CASE', 'WHEN', 'THEN',
                   'ELSE', 'END', 'AS', 'ASC', 'DESC', 'NULL',
                   'COUNT', 'SUM', 'AVG', 'MAX', 'MIN', 'COALESCE', 'NULLIF'];

        kws.forEach(function (kw) {
            var re = new RegExp('\\b' + kw.replace(/ /g, '\\s+') + '\\b', 'gi');
            s = s.replace(re, kw);
        });

        // Step 3: line-break before major clauses (preceded by a space → insert newline)
        var breakBefore = ['LEFT OUTER JOIN', 'RIGHT OUTER JOIN', 'FULL OUTER JOIN',
                           'LEFT JOIN', 'RIGHT JOIN', 'INNER JOIN', 'CROSS JOIN', 'FULL JOIN',
                           'GROUP BY', 'ORDER BY', 'UNION ALL', 'UNION', 'INSERT INTO',
                           'DELETE FROM', 'CREATE TABLE', 'ALTER TABLE',
                           'JOIN', 'FROM', 'WHERE', 'HAVING', 'LIMIT', 'OFFSET',
                           'UPDATE', 'INSERT', 'DELETE', 'VALUES', 'SET'];

        breakBefore.forEach(function (kw) {
            var re = new RegExp(' (' + kw.replace(/ /g, ' ') + ')\\b', 'g');
            s = s.replace(re, '\n$1');
        });

        // Step 4: indent continuation lines
        var lines = s.split('\n').filter(function (l) { return l.trim(); });
        return lines.map(function (l, i) { return (i === 0 ? '' : '  ') + l.trim(); }).join('\n');
    }

    // ── Format dispatch ───────────────────────────────────────────────────────
    function doFormat() {
        hideError();
        hideBanner();
        var code = inputArea.value;
        if (!code.trim()) {
            showError('Nothing to format — paste some code first.');
            return;
        }

        var lang = selectedLang === 'auto' ? detectLang(code) : selectedLang;

        // CDN required for JS, HTML, CSS
        if ((lang === 'js' || lang === 'html' || lang === 'css') &&
                !document.body.dataset.ready) {
            showError('JS/HTML/CSS formatting requires external libraries that are still loading. ' +
                      'Try JSON or SQL, or wait a moment and try again.');
            return;
        }

        var result;
        try {
            switch (lang) {
                case 'json': result = formatJSON(code); break;
                case 'js':   result = formatJS(code);   break;
                case 'html': result = formatHTML(code); break;
                case 'css':  result = formatCSS(code);  break;
                case 'sql':  result = formatSQL(code);  break;
                default:     result = formatJS(code);
            }
        } catch (e) {
            showError((lang === 'json' ? 'JSON parse error: ' : 'Format error: ') + e.message);
            return;
        }

        outputArea.value = result;
        updateStats(code, result, lang);
        showBanner('✓ Formatted as ' + langName(lang));
        updateMeta();
        schedSave();
    }

    // ── Stats ─────────────────────────────────────────────────────────────────
    function langName(l) {
        return { json: 'JSON', js: 'JavaScript', html: 'HTML', css: 'CSS', sql: 'SQL', auto: 'Auto' }[l] || l.toUpperCase();
    }

    function lineCount(s) { return s ? s.split('\n').length : 0; }

    function updateStats(input, output, lang) {
        var inL = lineCount(input), inC = input.length;
        var outL = lineCount(output), outC = output.length;
        statLang.textContent = '🔍 ' + langName(lang);
        statIn.textContent   = inL + ' ln / ' + inC + ' ch';
        statOut.textContent  = outL + ' ln / ' + outC + ' ch';
        var diff = outL - inL;
        statDiff.style.display     = 'inline';
        statDiff.textContent       = (diff >= 0 ? '+' : '') + diff + ' ln';
        statDiff.style.color       = diff > 0 ? 'var(--green)' : diff < 0 ? 'var(--red)' : 'var(--muted)';
        statDiff.style.borderColor = statDiff.style.color;
        statDiff.style.background  = diff > 0 ? 'rgba(34,197,94,.1)' :
                                      diff < 0 ? 'rgba(239,68,68,.1)' : 'transparent';
    }

    function updateMeta() {
        var inL = lineCount(inputArea.value);
        var outL = lineCount(outputArea.value);
        inMeta.textContent  = inputArea.value  ? inL  + ' ln' : '';
        outMeta.textContent = outputArea.value ? outL + ' ln' : '';
    }

    // ── Banner / toast helpers ────────────────────────────────────────────────
    function showError(msg)  { errorBanner.textContent = msg; errorBanner.classList.add('visible'); }
    function hideError()     { errorBanner.classList.remove('visible'); }
    function showBanner(msg) { successBanner.textContent = msg; successBanner.classList.add('visible'); }
    function hideBanner()    { successBanner.classList.remove('visible'); }

    function showToast(msg) {
        clearTimeout(toastTimer);
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2500);
    }

    // ── Language button selection ─────────────────────────────────────────────
    document.querySelectorAll('.lang-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            selectedLang = btn.getAttribute('data-lang');
            document.querySelectorAll('.lang-btn').forEach(function (b) {
                var on = b === btn;
                b.classList.toggle('active', on);
                b.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            schedSave();
        });
    });

    // ── Button handlers ───────────────────────────────────────────────────────
    document.getElementById('btnFormat').addEventListener('click', doFormat);

    // Ctrl/Cmd+Enter shortcut
    inputArea.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doFormat(); }
    });

    document.getElementById('btnCopy').addEventListener('click', function () {
        var text = outputArea.value;
        if (!text) { showToast('Nothing to copy — format first'); return; }
        navigator.clipboard.writeText(text).then(function () {
            showToast('✓ Copied to clipboard');
        }).catch(function () {
            showToast('Copy failed — please copy manually');
        });
    });

    document.getElementById('btnDownload').addEventListener('click', function () {
        var text = outputArea.value;
        if (!text) { showToast('Nothing to download — format first'); return; }
        var exts = { json: '.json', js: '.js', html: '.html', css: '.css', sql: '.sql' };
        var ext  = exts[selectedLang === 'auto' ? detectLang(inputArea.value) : selectedLang] || '.txt';
        var blob = new Blob([text], { type: 'text/plain' });
        var url  = URL.createObjectURL(blob);
        var a    = document.createElement('a');
        a.href = url; a.download = 'formatted' + ext; a.click();
        URL.revokeObjectURL(url);
        showToast('✓ Downloading…');
    });

    document.getElementById('btnClear').addEventListener('click', function () {
        inputArea.value  = '';
        outputArea.value = '';
        hideError(); hideBanner();
        statLang.textContent = '—';
        statIn.textContent   = '—';
        statOut.textContent  = '—';
        statDiff.style.display = 'none';
        inMeta.textContent  = '';
        outMeta.textContent = '';
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        showToast('✓ Cleared');
    });

    // ── Sample snippets ───────────────────────────────────────────────────────
    var SAMPLES = {
        json: '{"users":[{"id":1,"name":"Alice","email":"alice@example.com","roles":["admin","user"],"settings":{"theme":"dark","notifications":true,"timezone":"UTC"}},{"id":2,"name":"Bob","email":"bob@example.com","roles":["user"],"settings":{"theme":"light","notifications":false,"timezone":"EST"}}],"meta":{"total":2,"page":1}}',
        js:   'function fetchUser(id){return fetch(\'/api/users/\'+id).then(r=>r.json()).then(data=>{if(!data.id)throw new Error(\'Not found\');return{id:data.id,name:data.name,email:data.email};}).catch(err=>console.error(\'Error:\',err));}',
        html: '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sample Page</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><nav><a href="/">Home</a><a href="/about">About</a><a href="/contact">Contact</a></nav></header><main><section class="hero"><h1>Hello, World!</h1><p>This is a sample HTML page to demonstrate formatting.</p><a href="#" class="btn">Get Started</a></section></main><footer><p>&copy; 2025 Example Inc.</p></footer></body></html>',
        css:  '*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}.container{max-width:1200px;margin:0 auto;padding:0 16px;}.card{background:#fff;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1);padding:20px;margin-bottom:16px;transition:transform .2s ease,box-shadow .2s ease;}.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15);}@media(max-width:768px){.container{padding:0 8px;}.card{padding:14px;}}',
        sql:  'select u.id, u.name, u.email, count(o.id) as total_orders, sum(o.total) as revenue from users u left join orders o on u.id = o.user_id where u.created_at > \'2024-01-01\' and u.active = 1 group by u.id, u.name, u.email having count(o.id) > 0 order by revenue desc limit 20'
    };

    document.getElementById('btnSample').addEventListener('click', function () {
        var lang = selectedLang === 'auto' ? 'json' : selectedLang;
        inputArea.value  = SAMPLES[lang] || SAMPLES.json;
        outputArea.value = '';
        hideError(); hideBanner();
        updateMeta();
        schedSave();
        showToast('✓ Sample loaded — click ⚡ Format');
    });

    // ── localStorage ──────────────────────────────────────────────────────────
    function schedSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveState, 800);
    }
    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                input: inputArea.value,
                lang:  selectedLang
            }));
        } catch (e) {}
    }
    function loadState() {
        try {
            var s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
            if (!s) return;
            if (s.input) { inputArea.value = s.input; updateMeta(); }
            if (s.lang) {
                selectedLang = s.lang;
                document.querySelectorAll('.lang-btn').forEach(function (b) {
                    var on = b.getAttribute('data-lang') === s.lang;
                    b.classList.toggle('active', on);
                    b.setAttribute('aria-pressed', on ? 'true' : 'false');
                });
            }
        } catch (e) {}
    }

    // ── Input change ──────────────────────────────────────────────────────────
    inputArea.addEventListener('input', function () {
        hideError();
        updateMeta();
        schedSave();
    });

    // ── Mobile tabs ───────────────────────────────────────────────────────────
    document.getElementById('tabInput').addEventListener('click', function () {
        document.getElementById('inputPane').classList.add('mob-visible');
        document.getElementById('outputPane').classList.remove('mob-visible');
        document.getElementById('tabInput').classList.add('active');
        document.getElementById('tabOutput').classList.remove('active');
    });
    document.getElementById('tabOutput').addEventListener('click', function () {
        document.getElementById('outputPane').classList.add('mob-visible');
        document.getElementById('inputPane').classList.remove('mob-visible');
        document.getElementById('tabOutput').classList.add('active');
        document.getElementById('tabInput').classList.remove('active');
    });

    // ── Init ──────────────────────────────────────────────────────────────────
    loadState();

    // Desktop: show both panes; mobile: input visible by default
    if (window.innerWidth > 700) {
        document.getElementById('outputPane').classList.add('mob-visible');
    }

}());
</script>
</body>
</html>
