<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="bf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>

  <!-- Ambient blobs -->
  <circle cx="180"  cy="120"  r="260" fill="#a855f7" opacity="0.09" filter="url(#bf)"/>
  <circle cx="1060" cy="520"  r="260" fill="#22d3ee" opacity="0.07" filter="url(#bf)"/>

  <!-- Frame border -->
  <rect x="24" y="24" width="1152" height="582" rx="14" fill="none"
        stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>

  <!-- Corner dots -->
  <circle cx="56" cy="56" r="4"   fill="#a855f7" opacity="0.55"/>
  <circle cx="76" cy="40" r="2.5" fill="#22d3ee" opacity="0.45"/>
  <circle cx="1144" cy="574" r="4"   fill="#22d3ee" opacity="0.55"/>
  <circle cx="1124" cy="590" r="2.5" fill="#a855f7" opacity="0.45"/>

  <!-- Wordmark -->
  <text x="600" y="248"
        font-family="Arial Black,Arial,Helvetica,sans-serif"
        font-size="108" font-weight="900" letter-spacing="-4"
        text-anchor="middle" fill="url(#g)">Ravionus</text>

  <!-- Tagline -->
  <text x="600" y="308"
        font-family="Arial,Helvetica,sans-serif"
        font-size="27" font-weight="400" letter-spacing="0.8"
        text-anchor="middle" fill="#7070a0">
    Developer Tools  ·  Playgrounds  ·  Interactive Learning
  </text>

  <!-- Gradient divider -->
  <rect x="460" y="344" width="280" height="2" rx="1" fill="url(#g)" opacity="0.4"/>

  <!-- Feature pills (4 × centered, total span 700px, left=250 right=950) -->
  <!-- Pill 1: 21 Dev Tools -->
  <rect x="250" y="382" width="160" height="40" rx="20"
        fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.35)" stroke-width="1"/>
  <text x="330" y="408"
        font-family="Arial,Helvetica,sans-serif"
        font-size="17" font-weight="700" text-anchor="middle" fill="#c084fc">21 Dev Tools</text>

  <!-- Pill 2: 12 Playgrounds -->
  <rect x="420" y="382" width="180" height="40" rx="20"
        fill="rgba(34,211,238,0.10)" stroke="rgba(34,211,238,0.35)" stroke-width="1"/>
  <text x="510" y="408"
        font-family="Arial,Helvetica,sans-serif"
        font-size="17" font-weight="700" text-anchor="middle" fill="#22d3ee">12 Playgrounds</text>

  <!-- Pill 3: Learn Platform -->
  <rect x="610" y="382" width="160" height="40" rx="20"
        fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.35)" stroke-width="1"/>
  <text x="690" y="408"
        font-family="Arial,Helvetica,sans-serif"
        font-size="17" font-weight="700" text-anchor="middle" fill="#c084fc">Learn Platform</text>

  <!-- Pill 4: No Sign-up -->
  <rect x="780" y="382" width="170" height="40" rx="20"
        fill="rgba(34,211,238,0.10)" stroke="rgba(34,211,238,0.35)" stroke-width="1"/>
  <text x="865" y="408"
        font-family="Arial,Helvetica,sans-serif"
        font-size="17" font-weight="700" text-anchor="middle" fill="#22d3ee">No Sign-up</text>

  <!-- URL -->
  <text x="600" y="532"
        font-family="Arial,Helvetica,sans-serif"
        font-size="21" font-weight="500" letter-spacing="3"
        text-anchor="middle" fill="#3a3a5c">RAVIONUS.COM</text>
</svg>
