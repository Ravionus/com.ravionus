<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' https: data:; connect-src 'self' https://*.googleapis.com https://*.cloudfunctions.net wss://*.firebaseio.com https://*.gstatic.com https://cdnjs.cloudflare.com; frame-src https://accounts.google.com https://ravionus-f5574.firebaseapp.com;">
  <title>Learn — Ravionus</title>
  <meta name="description"
    content="Interactive bite-sized learning on Git, JavaScript, and more — with quizzes built right in. Start learning for free on Ravionus.">
  <link rel="canonical" href="https://ravionus.com/learn/">
  <meta property="og:title" content="Learn — Ravionus">
  <meta property="og:description" content="Interactive bite-sized learning on Git, JavaScript, and more — with quizzes built right in. Start learning for free on Ravionus.">
  <meta property="og:type" content="website">
    <meta property="og:site_name" content="Ravionus">
  <meta property="og:url" content="https://ravionus.com/learn/">
    <meta property="og:image" content="https://ravionus.com/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Ravionus — developer tools, interactive playgrounds, and bite-sized learning.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://ravionus.com/og-image.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <script src="/site.js"></script>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-eyebrow">
      <span>✨</span> Interactive Courses
    </div>
    <h1>
      Learn things that<br>
      <span class="gradient-text">actually matter</span>
    </h1>
    <p class="hero-sub">
      Bite-sized lessons paired with instant quizzes — so you don't just read, you <em>understand</em>.
    </p>
    <div class="hero-stats">
      <div class="stat">
        <div class="stat-value" id="statTopics">—</div>
        <div class="stat-label">Topics</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statLessons">—</div>
        <div class="stat-label">Lessons</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statQuizzes">—</div>
        <div class="stat-label">Quizzes</div>
      </div>
    </div>
  </section>

  <!-- Search -->
  <div class="search-bar">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Search topics, tags…"
        aria-label="Search topics" autocomplete="off">
    </div>
  </div>

  <!-- Topic Grid -->
  <section class="topics-section">
    <div class="section-header">
      <span class="section-title">All Topics</span>
    </div>
    <div class="topics-grid" id="topicsGrid">
      <!-- Rendered by app.js -->
    </div>
  </section>

  <!-- jsPDF (for certificates) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
          integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
  <script src="content.js"></script>
  <script type="module" src="app.js"></script>
</body>

</html>
